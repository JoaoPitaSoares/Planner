<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07120d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planner">
<title>Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{
  /* layout: app de telemóvel numa coluna · cada separador abre com um relvado, cartões escuros por baixo, barra de separadores flutuante */
  --bg:#07120d;--card:#0f2019;--card2:#152b21;--ink:#eef6f0;--mute:#8ea698;--accent:#ff6a3d;--done:#5ad690;
  --line:rgba(238,246,240,.09);--on-accent:#1d0903;--on-done:#04170c;--field:#0f4a2e;--field2:#13573a;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-family:var(--f-display);line-height:1.02;text-wrap:balance}
h2{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
h3{font-size:21px;font-weight:600}
p{margin:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(7,18,13,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:9px;font:700 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.1em}
.brand i{display:inline-block;width:8px;height:20px;border-radius:2px;background:var(--accent);transform:skewX(-16deg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute)}
.pill.good::before{background:var(--done)}
.pill.bad::before{background:var(--accent)}
main{max-width:620px;margin:0 auto;padding:6px 16px calc(170px + env(safe-area-inset-bottom))}
.grid{display:grid;gap:14px}
.pitch{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;color:#f5fbf7;display:flex;align-items:center;justify-content:space-between;gap:14px;background:repeating-linear-gradient(90deg,var(--field) 0 26px,var(--field2) 26px 52px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.pitch::before{content:"";position:absolute;top:0;bottom:0;left:72%;border-left:2px dashed rgba(255,255,255,.26)}
.pitch::after{content:"22";position:absolute;left:calc(72% + 6px);bottom:8px;font:700 13px/1 var(--f-display);color:rgba(255,255,255,.35)}
.pitch>*{position:relative;z-index:1}
.pitch small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;opacity:.8}
.pitch h1{font:700 44px/.95 var(--f-display);text-transform:uppercase;margin:6px 0 8px}
.pitch p{font-size:14px;opacity:.9}
.pitch .chip{margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff}
.chip.warn{background:var(--accent);color:var(--on-accent)}
.ring .trk{fill:none;stroke:rgba(255,255,255,.14)}
.ring .arc{fill:none;stroke:var(--done);stroke-linecap:round}
.pring{display:grid;place-items:center;flex:none}
.pring>*{grid-area:1/1}
.pring b{font:700 26px/1 var(--f-display)}
.pring b small{display:inline;font-size:14px;letter-spacing:0;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:12px}
.mute{color:var(--mute)}
.small{font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:14px;padding:11px 16px;min-height:46px;font:700 15px/1.1 var(--f-body);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(238,246,240,.18)}
.btn.sm{min-height:36px;padding:8px 12px;font-size:14px;border-radius:12px}
.lnk{appearance:none;border:0;background:none;padding:6px 0 0;color:var(--accent);font:700 14px/1 var(--f-body);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:#0a1812;border:1px solid rgba(238,246,240,.14);border-radius:12px;padding:8px 10px;min-height:44px;max-width:100%}
textarea{width:100%;min-height:72px;font-size:13px}
.n{width:74px;text-align:center;font:700 19px/1 var(--f-display);font-variant-numeric:tabular-nums}
.n.sm{width:72px;min-height:36px;font-size:17px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dbtn{appearance:none;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 0 8px;display:grid;justify-items:center;gap:5px;cursor:pointer}
.dbtn small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.dbtn b{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.dbtn.today small{color:var(--accent)}
.dbtn.sel{background:var(--card2);border-color:var(--accent)}
.next{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:linear-gradient(135deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;padding:16px}
.nx-t{display:grid;gap:2px;min-width:0}
.nx-t small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.nx-t b{font:700 23px/1.05 var(--f-display);text-transform:uppercase}
.nx-t span{font-size:14px;color:var(--mute)}
.tile{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--catbg);color:var(--cat);flex:none}
.tile.big{width:54px;height:54px;border-radius:16px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0;padding-top:2px}
.item:last-child{padding-bottom:0}
.t{font-weight:700}
.h{font-size:14px;color:var(--mute)}
.item.done .t{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.chk{width:38px;height:38px;border-radius:50%;border:2px solid rgba(238,246,240,.22);background:transparent;color:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.chk.on{background:var(--done);border-color:var(--done);color:var(--on-done)}
.mlab{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card2);border-radius:14px;padding:12px;display:grid;gap:4px}
.stat b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stat b small{font-size:18px;color:var(--mute)}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segb{appearance:none;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 10px 9px;display:grid;justify-items:start;gap:2px;cursor:pointer;text-align:left}
.segb b{font:700 28px/1 var(--f-display)}
.segb span{font-size:13px;font-weight:700}
.segb small{font-size:12px;color:var(--mute)}
.segb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.segb[aria-pressed="true"] small{color:inherit;opacity:.75}
.warm{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.warm li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:15px}
.warm li::before{content:"";width:8px;height:8px;margin-top:7px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.exh{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.tag{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 17px/1 var(--f-display);background:var(--accent);color:var(--on-accent)}
.tag.b2{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.rx{display:block;font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:3px}
.tip{font-size:14px;color:var(--mute)}
.sug{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.pv{background:var(--card2);border-radius:999px;padding:6px 12px}
.pv b{color:var(--done)}
.upc{display:inline-flex;align-items:center;gap:3px;color:var(--done);font-weight:700;font-size:13px}
.lastv{color:var(--mute)}
.sets{display:grid;gap:8px}
.set{display:flex;align-items:center;gap:6px;background:#0b1913;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px}
.set .sn{width:16px;font:700 16px/1 var(--f-display);color:var(--mute)}
.set .u{font-size:13px;color:var(--mute)}
.set input{background:transparent;border-color:transparent;width:62px}
.set input:focus{background:#0a1812;border-color:rgba(238,246,240,.14)}
.set.on{border-color:rgba(90,214,144,.35);background:rgba(90,214,144,.07)}
.ok{margin-left:auto;width:46px;height:46px;border-radius:13px;border:2px solid rgba(238,246,240,.2);background:transparent;color:var(--mute);cursor:pointer;display:grid;place-items:center;padding:0}
.ok.on{background:var(--done);border-color:var(--done);color:var(--on-done)}
.drill{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;padding-top:12px;border-top:1px solid var(--line)}
.dn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:rgba(76,194,255,.15);color:#4cc2ff;grid-row:span 3}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.drill p{font-size:15px}
.drill .btn{justify-self:start;margin-top:4px}
.drill>*:not(.dn){grid-column:2}
.wk{font-size:14px;background:rgba(76,194,255,.1);border-radius:10px;padding:8px 10px}
.wk b{color:#4cc2ff}
.pitch.board{background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 26px),#2a2148}
.pitch.board::before,.pitch.board::after{display:none}
.lp{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.lp:first-child{border-top:0;padding-top:0}
.lpb{display:grid;gap:6px;min-width:0}
.lpt{width:100%;min-height:40px;font-weight:600}
.lp.ok1 .lpt{color:var(--mute);text-decoration:line-through}
.lp.ko .lpt{border-color:rgba(255,106,61,.55)}
.lpa{display:flex;gap:16px;flex-wrap:wrap}
.lpa .lnk{padding:2px 0}
.lnk.dim{color:var(--mute)}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.bars{display:grid;gap:10px}
.barr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.barr i{grid-column:1/-1;display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.barr i b{display:block;height:100%;background:#b48cff}
.wkc{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--mute)}
.recrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}
.recrow label{display:grid}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.nx{display:grid;justify-items:end;min-width:54px}
.nx small{font-size:10px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.nx b{font:700 26px/1 var(--f-display);color:var(--done);font-variant-numeric:tabular-nums}
.spark .g{stroke:var(--line);stroke-width:1}
.spark .a{fill:rgba(90,214,144,.14)}
.spark .l{fill:none;stroke:var(--done);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .d{fill:var(--done)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.fld{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:15px}
.fld.col{display:grid;justify-content:stretch}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;max-width:596px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:24px;background:rgba(15,32,25,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.5)}
.tabs button{appearance:none;border:0;background:transparent;color:var(--mute);display:grid;justify-items:center;gap:3px;padding:8px 2px 7px;border-radius:18px;font:700 12px/1 var(--f-body);cursor:pointer}
.tabs button[aria-current="page"]{color:var(--on-accent);background:var(--accent)}
.rest{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:7;max-width:588px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 16px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.rest .rl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.rest b{margin-right:auto;font:700 32px/1 var(--f-display);font-variant-numeric:tabular-nums}
.inv{background:transparent;color:inherit;border:1px solid currentColor}
.ov{position:fixed;inset:0;z-index:9;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding:calc(16px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));color:#f5fbf7;background:repeating-linear-gradient(90deg,var(--field) 0 30px,var(--field2) 30px 60px)}
.ov.work{background:var(--accent);color:var(--on-accent)}
.ov.call{background:#050d09;color:var(--ink)}
.ovtop{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:700}
.ov .btn.ghost{color:inherit;border-color:currentColor}
.ovc{display:grid;place-items:center;align-self:center}
.ovc>*{grid-area:1/1}
.oring{width:min(80vw,340px);height:min(80vw,340px)}
.oring .trk{fill:none;stroke:currentColor;opacity:.16;stroke-width:6}
.oring .arc{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round}
.ov.noring .oring{visibility:hidden}
.big{text-align:center;font:700 clamp(80px,26vw,170px)/1 var(--f-display);font-variant-numeric:tabular-nums;text-transform:uppercase;overflow-wrap:anywhere}
.ov.noring .big{font-size:clamp(110px,36vw,240px)}
.sub{text-align:center;font:700 28px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.ovx{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;align-items:center}
.ovx .n{background:rgba(0,0,0,.25);color:inherit;border-color:currentColor}
.flash{animation:fl .35s ease-out}
@keyframes fl{from{transform:scale(1.2)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:10;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 26px rgba(0,0,0,.4)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.pitch h1{font-size:38px}.set input{width:54px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><i aria-hidden="true"></i>Planner</div><span id="sync" class="pill">A ligar…</span></header>
<main id="view"></main>
<div id="rest" class="rest" hidden><span class="rl">Descanso</span><b id="restT">0:00</b><button class="btn sm inv" data-act="rplus">+15 s</button><button class="btn sm inv" data-act="rskip">Saltar</button></div>
<div id="ov" class="ov" hidden role="dialog" aria-modal="true" aria-label="Temporizador">
  <div class="ovtop"><span id="ovInfo"></span><button id="ovStop" class="btn ghost sm" data-act="ovstop">Parar</button></div>
  <div class="ovc"><svg class="oring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="54" class="trk"/><circle id="ovArc" cx="60" cy="60" r="54" class="arc" stroke-dasharray="339.29" stroke-dashoffset="0" transform="rotate(-90 60 60)"/></svg><div id="ovBig" class="big" aria-live="assertive"></div></div>
  <div id="ovSub" class="sub"></div>
  <div id="ovX" class="ovx"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<nav id="tabs" class="tabs" aria-label="Secções"></nav>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n===''||n==null||isNaN(n))?'':String(Math.round(n*100)/100).replace('.',',');
const num=v=>{if(v===''||v==null)return '';const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?'':x;};
const z=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parse=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],(a[1]||1)-1,a[2]||1);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const monday=d=>addDays(d,-((d.getDay()+6)%7));
const today=()=>iso(new Date());
const mmss=s=>Math.floor(s/60)+':'+z(s%60);
const DN=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const nice=ds=>{const d=parse(ds);return DN[d.getDay()]+', '+d.getDate()+' '+MES[d.getMonth()];};
const STANDALONE=(()=>{try{return window.self===window.top&&!window.claude;}catch(e){return false;}})();

/* ---------- ícones ---------- */
const ICO={
 gym:'<path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/>',
 ball:'<ellipse cx="12" cy="12" rx="9.5" ry="5.6" transform="rotate(-38 12 12)"/><path d="M8.6 15.4l6.8-6.8M10.3 11.6l2.1 2.1M11.9 10l2.1 2.1"/>',
 shield:'<path d="M12 3l7.5 3v5.5c0 4.6-3.2 8.2-7.5 9.5-4.3-1.3-7.5-4.9-7.5-9.5V6z"/>',
 pen:'<path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19z"/><path d="M13.5 7l3.5 3.5"/>',
 read:'<path d="M3 5.5h6a3 3 0 0 1 3 3V20a2.5 2.5 0 0 0-2.5-2.5H3zM21 5.5h-6a3 3 0 0 0-3 3V20a2.5 2.5 0 0 1 2.5-2.5H21z"/>',

async function pushRemote(){if(!DBREF)return;if(saving){again=true;return;}saving=true;try{await DBREF.set({json:JSON.stringify(S),upd:S.upd});setSync('ok');}catch(e){setSync('err');}saving=false;if(again){again=false;pushRemote();}}
function setSync(s){SYNC=s;const p=$('#sync');if(!p)return;const loc=s==='local'&&STANDALONE;p.className='pill'+(s==='ok'||loc?' good':s==='err'?' bad':'');p.textContent=s==='ok'?'Sincronizado':s==='err'?'Erro a guardar':s==='wait'?'A ligar…':loc?'Guardado no telemóvel':'Só neste aparelho';}
function unpack(r){if(!r)return null;try{if(typeof r.data==='function'){if(r.exists===false)return null;return r.data();}}catch(e){return null;}if(r.data&&typeof r.data==='object'&&!('json' in r))return r.data;return r;}
async function connect(){
 const cl=window.claude;
 if(!cl||typeof cl.use!=='function'){if(!STANDALONE&&tries++<2){setTimeout(connect,1500);return;}setSync('local');return;}
 const to=setTimeout(()=>{if(SYNC==='wait')setSync('local');},10000);
 try{
  const db=await cl.use('db');if(!db){clearTimeout(to);setSync('local');return;}
  const user=await cl.use('user');const uid=user?(typeof user.id==='function'?await user.id():user.id):null;
  if(!uid){clearTimeout(to);setSync('local');return;}
  const ref=db.collection('data/users/'+uid).doc('estado');
  let rem=null;try{rem=unpack(await ref.get());}catch(e){rem=null;}
  clearTimeout(to);DBREF=ref;
  if(rem&&typeof rem.json==='string'){let rs=null;try{rs=JSON.parse(rem.json);}catch(e){}
   if(rs&&(+rs.upd||0)>=S.upd){S=migrate(rs);saveLocal();render();setSync('ok');return;}}
  if(S.upd)await pushRemote();else setSync('ok');
 }catch(e){clearTimeout(to);setSync('local');}
}

 }
 let cond='';
 for(const id of ['sprint8','rsa','remo8']){const e=EX[id],w=cycleWeek(today()),ser=metricSeries(id,w);cond+=`<div class="prow"><div><div class="t">${esc(e.n)}</div><div class="h">${ser.length?`semana ${w+1}: último ${fmt(ser[ser.length-1])} · melhor ${fmt(Math.max(...ser))} ${esc(e.m)}`:'ainda sem registos'}</div></div>${spark(ser.slice(-12))}<div></div></div>`;}
 let rug='';
 for(const k in RECS){const ser=S.rug[k].map(a=>+a[1]);rug+=`<div class="prow"><div><div class="t">${esc(RECS[k].n)}</div><div class="h">${ser.length?`último ${ser[ser.length-1]} · recorde ${Math.max(...ser)} ${esc(RECS[k].u)}`:'ainda sem registos'}</div></div>${spark(ser.slice(-12))}<div></div></div>`;}
 let tb='';const m0=monday(new Date());
 for(let w=3;w>=0;w--){const mon=addDays(m0,-7*w),o=weekNums(mon);tb+=`<tr><td>${mon.getDate()} ${MES[mon.getMonth()]}</td><td>${o.gym}/${o.gymP}</td><td>${o.solo}/${o.soloP}</td><td>${o.club}/${o.clubP}</td><td>${o.pal}</td><td>${o.env}</td><td>${o.pag}</td><td>${(q=>q==null?'—':Math.round(q*100)+'%')(ppc(lpWeek(mon)))}</td></tr>`;}
 const sel=(k,opts)=>`<select id="s-${k}" data-set="${k}">${opts.map(([v,l])=>`<option value="${v}"${String(S.set[k])===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
 const store=SYNC==='ok'?'Os dados ficam na tua conta e aparecem noutros aparelhos.':STANDALONE?'Os dados ficam guardados neste telemóvel. Copia-os de vez em quando para uma nota, por segurança.':'Os dados estão só neste aparelho. Copia-os de vez em quando para uma nota.';
 return `<section class="grid">
<div class="pitch"><div><small>${S.log.length} ${S.log.length===1?'sessão registada':'sessões registadas'}</small><h1>Progresso</h1><p>Séries e reps mudam todas as semanas num ciclo de 4 e a app recalcula a carga. Se cumpriste tudo, sobe; na semana leve baixa 10%.</p></div></div>
<div class="card"><h2>Cargas</h2>${lift}</div>
<div class="card"><h2>Condição</h2>${cond}</div>
<div class="card"><h2>Rugby</h2>${rug}</div>
<div class="card"><h2>Últimas 4 semanas</h2><div class="tbl"><table><thead><tr><th>Semana</th><th>Ginásio</th><th>Solo</th><th>Clube</th><th>Palavras</th><th>Cand.</th><th>Págs</th><th>PPC</th></tr></thead><tbody>${tb}</tbody></table></div></div>
<div class="card"><h2>Definições</h2>
<label class="fld" for="s-club">3.º treino do clube (habitual) ${sel('club',[[4,'Quinta'],[5,'Sexta']])}</label>
<label class="fld" for="s-game">Dia de jogo ${sel('game',[[6,'Sábado'],[0,'Domingo'],[-1,'Sem jogo']])}</label>
<label class="fld" for="s-start">Início do ciclo <input type="date" id="s-start" data-set="start" value="${esc(S.set.start)}"></label>
<label class="fld" for="s-snd">Ordens por ${sel('snd',[['voz','Voz'],['bips','Bips']])}</label>
<div class="row"><button class="btn ghost" data-act="test">Testar som</button></div></div>
<div class="card"><h2>Cópia de segurança</h2><p class="small mute">${store}</p><div class="row"><button class="btn ghost" data-act="copy">Copiar dados</button></div><label class="fld col" for="bk">Colar uma cópia para importar<textarea id="bk"></textarea></label><div class="row"><button class="btn ghost" data-act="imp">Importar</button></div></div>
</section>`;
}
/* ---------- trabalho: Last Planner ---------- */
const CAUSAS=['Informação em falta','Dependência de outros','Recursos ou pessoas','Tempo mal estimado','Prioridade mudou','Pedido do cliente','Outra'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lpGet=id=>S.lp.t.find(x=>x.id===id);
function nextWork(ds){let d=addDays(parse(ds),1);while(d.getDay()===0||d.getDay()===6)d=addDays(d,1);return iso(d);}
function lpWeek(mon){const a=iso(mon),b=iso(addDays(mon,6));return S.lp.t.filter(x=>x.d>=a&&x.d<=b);}
function ppc(list,upTo){const L=list.filter(x=>!upTo||x.d<=upTo);return L.length?L.filter(x=>x.s===1).length/L.length:null;}
function carry(x){x.s=2;S.lp.t.push({id:uid(),t:x.t,d:nextWork(x.d),s:0,c:''});}
let LSEL=today();
function vWork(){
 const ds=LSEL,mon=monday(parse(ds)),td=today(),wk=lpWeek(mon),p=ppc(wk,td),cut=wk.filter(x=>x.d<=td),done=cut.filter(x=>x.s===1).length;
 let strip='';
 for(let i=0;i<7;i++){const di=addDays(mon,i),dsi=iso(di),L=S.lp.t.filter(x=>x.d===dsi),c=L.filter(x=>x.s===1).length;strip+=`<button class="dbtn${dsi===ds?' sel':''}${dsi===td?' today':''}" data-act="lday" data-ds="${dsi}" aria-label="${esc(nice(dsi))}: ${c} de ${L.length} cumpridos"><small>${DS[di.getDay()]}</small><b>${di.getDate()}</b>${ring(L.length?c/L.length:0,22,3)}</button>`;}
 const L=S.lp.t.filter(x=>x.d===ds);
 const rows=L.map(x=>`<div class="lp${x.s===1?' ok1':x.s===2?' ko':''}"><button class="chk${x.s===1?' on':''}" data-act="lpok" data-id="${x.id}" aria-pressed="${x.s===1}" aria-label="Cumprido">${ic('check',18)}</button><div class="lpb"><input class="lpt" data-lp="${x.id}" value="${esc(x.t)}" aria-label="Compromisso">${x.s===2?`<select data-lpc="${x.id}" aria-label="Causa do incumprimento"><option value="">Causa?</option>${CAUSAS.map(c=>`<option${x.c===c?' selected':''}>${c}</option>`).join('')}</select>`:''}<div class="lpa">${x.s!==1?`<button class="lnk" data-act="lpko" data-id="${x.id}">${x.s===2?'Voltar a pendente':'Não cumprido'}</button>`:''}${x.s===0?`<button class="lnk" data-act="lpmv" data-id="${x.id}">Replanear ›</button>`:''}<button class="lnk dim" data-act="lpdel" data-id="${x.id}">Apagar</button></div></div></div>`).join('');
 const from=iso(addDays(new Date(),-27)),cnt={};
 for(const x of S.lp.t)if(x.s===2&&x.d>=from&&x.d<=td){const k=x.c||'Sem causa';cnt[k]=(cnt[k]||0)+1;}
 const ks=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]),mx=ks.length?cnt[ks[0]]:1;
 const par=ks.map(k=>`<div class="barr"><span>${esc(k)}</span><b>${cnt[k]}</b><i><b style="width:${Math.round(cnt[k]/mx*100)}%"></b></i></div>`).join('');
 const rs=S.lp.r.map(x=>`<div class="lp${x.ok?' ok1':''}"><button class="chk${x.ok?' on':''}" data-act="rsok" data-id="${x.id}" aria-pressed="${!!x.ok}" aria-label="Removida">${ic('check',18)}</button><div class="lpb"><input class="lpt" data-rs="${x.id}" value="${esc(x.t)}" aria-label="Restrição"><div class="lpa"><button class="lnk dim" data-act="rsdel" data-id="${x.id}">Apagar</button></div></div></div>`).join('');
 const pc=p==null?'—':Math.round(p*100);
 return `<section class="grid">
<div class="pitch board"><div><small>Last Planner · semana de ${mon.getDate()} ${MES[mon.getMonth()]}</small><h1>PPC ${pc}${p==null?'':'%'}</h1><p>${cut.length?done+' de '+cut.length+' compromissos cumpridos até hoje':'Ainda sem compromissos nesta semana'}</p></div><div class="pring">${ring(p||0,88,8)}<b>${pc}<small>${p==null?'':'%'}</small></b></div></div>
<div class="strip">${strip}</div>
<div class="card"><h2>${esc(nice(ds))}</h2>${rows?`<div>${rows}</div>`:'<p class="small mute">Sem compromissos. Escreve só o que te comprometes a fechar neste dia.</p>'}<div class="addrow"><input id="lpNew" placeholder="Novo compromisso" aria-label="Novo compromisso"><button class="btn" data-act="lpadd">Adicionar</button></div>${L.some(x=>x.s===0)?'<button class="btn ghost" data-act="lpcarry">Fechar o dia: pendentes passam para o próximo dia útil</button>':''}</div>
<div class="card"><h2>Restrições a remover</h2>${rs?`<div>${rs}</div>`:'<p class="small mute">O que pode travar o plano das próximas semanas: informação, aprovações, pessoas.</p>'}<div class="addrow"><input id="rsNew" placeholder="Nova restrição" aria-label="Nova restrição"><button class="btn ghost" data-act="rsadd">Adicionar</button></div></div>
<div class="card"><h2>Causas · últimas 4 semanas</h2>${par?`<div class="bars">${par}</div>`:'<p class="small mute">Quando um compromisso não for cumprido, escolhe a causa. O Pareto aparece aqui.</p>'}</div>
</section>`;
}
const TABS=[['hoje','Hoje','sun'],['gym','Ginásio','gym'],['rugby','Rugby','ball'],['work','Trabalho','bag'],['prog','Progresso','chart']];
function render(){
 const v=TAB==='gym'?vGym():TAB==='rugby'?vRug():TAB==='work'?vWork():TAB==='prog'?vProg():vHoje();
 $('#view').innerHTML=v;
 $('#tabs').innerHTML=TABS.map(([k,l,i])=>`<button data-act="tab" data-tab="${k}" aria-current="${k===TAB?'page':'false'}">${ic(i,22)}<span>${l}</span></button>`).join('');
}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(TT);TT=setTimeout(()=>{t.hidden=true;},2800);}

/* ---------- ações ---------- */
const ACT={
 tab(b){TAB=b.dataset.tab;render();window.scrollTo(0,0);},
 day(b){SEL=b.dataset.ds;render();},
 chk(b){const r=dayRec(SEL),id=b.dataset.id;if(r.done[id])delete r.done[id];else r.done[id]=1;persist();render();},
 go(b){const g=b.dataset.go.split(':');TAB=g[0];if(g[1])GK=g[1];if(TAB==='work')LSEL=SEL;render();window.scrollTo(0,0);},
 gk(b){GK=b.dataset.k;render();},
 set(b){const e=EX[b.dataset.ex],row=draft(GK).x[e.id].s[+b.dataset.i];row[2]=row[2]?0:1;const on=!!row[2];b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));const s=b.closest('.set');if(s)s.classList.toggle('on',on);persist();if(on)rest(e.rest);},
 save(){
  const c=draft(GK),entry={d:today(),k:GK,x:{},m:{}};let any=false;
  for(const id in c.x){const r=c.x[id];if(r.s.some(a=>a[2])){entry.x[id]=r;any=true;}}
  for(const id in c.m){if(c.m[id]!==''&&c.m[id]!=null){entry.m[id]=+c.m[id];any=true;}}
  if(!any){toast('Marca com ✓ pelo menos uma série ou escreve um resultado.');return;}
  S.log.push(entry);delete S.cur[GK];dayRec(today()).done['gym'+GK]=1;stopRest();persist();render();window.scrollTo(0,0);toast('Sessão guardada. As cargas da próxima já estão atualizadas.');
 },
 reset(b){if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Toca outra vez para recomeçar';return;}delete S.cur[GK];persist();render();},
 int(b){runInt(eff(EX[b.dataset.ex]));},
 call(b){runCall(b.dataset.c,+b.dataset.block||0,b.dataset.rec||'',b.dataset.name||'');},
 ovstop(){stopAll();},
 again(){if(LASTCALL)runCall(LASTCALL.set,LASTCALL.block,LASTCALL.rec,LASTCALL.name);},
 ovrec(){const i=$('#ovIn'),v=num(i&&i.value);if(v===''){toast('Escreve o número primeiro.');return;}if(LASTCALL&&LASTCALL.rec){S.rug[LASTCALL.rec].push([today(),v]);persist();toast('Registado.');}$('#ovX').innerHTML='<button class="btn ghost" data-act="again">Outro bloco</button>';},
 ovm(b){const i=$('#ovIn'),v=num(i&&i.value);if(v!==''){draft(b.dataset.k).m[b.dataset.ex]=v;persist();}stopAll();render();},
 rec(b){const k=b.dataset.r,i=$('#rec-'+k),v=num(i&&i.value);if(v===''){toast('Escreve o número primeiro.');return;}S.rug[k].push([today(),v]);persist();render();toast('Registado.');},
 rplus(){if(RT){RT.end+=15000;tickRest();}},
 rskip(){stopRest();},
 lday(b){LSEL=b.dataset.ds;render();},
 lpadd(){const i=$('#lpNew'),v=(i&&i.value||'').trim();if(!v){toast('Escreve o compromisso primeiro.');return;}S.lp.t.push({id:uid(),t:v,d:LSEL,s:0,c:''});persist();render();const n=$('#lpNew');if(n)try{n.focus();}catch(e){}},
 lpok(b){const x=lpGet(b.dataset.id);if(!x)return;x.s=x.s===1?0:1;x.c='';persist();render();},
 lpko(b){const x=lpGet(b.dataset.id);if(!x)return;x.s=x.s===2?0:2;if(x.s!==2)x.c='';persist();render();},
 lpmv(b){const x=lpGet(b.dataset.id);if(!x)return;carry(x);persist();render();toast('Replaneado para '+nice(nextWork(x.d))+'. Escolhe a causa.');},
 lpdel(b){S.lp.t=S.lp.t.filter(x=>x.id!==b.dataset.id);persist();render();},
 lpcarry(){const L=S.lp.t.filter(x=>x.d===LSEL&&x.s===0);L.forEach(carry);persist();render();toast(L.length+' passaram para '+nice(nextWork(LSEL))+'. Escolhe as causas.');},
 rsadd(){const i=$('#rsNew'),v=(i&&i.value||'').trim();if(!v){toast('Escreve a restrição primeiro.');return;}S.lp.r.push({id:uid(),t:v,ok:0});persist();render();},
 rsok(b){const x=S.lp.r.find(y=>y.id===b.dataset.id);if(x){x.ok=x.ok?0:1;persist();render();}},
 rsdel(b){S.lp.r=S.lp.r.filter(y=>y.id!==b.dataset.id);persist();render();},
 cw(b){S.cw[iso(monday(parse(SEL)))]=+b.dataset.v;persist();render();},
 test(){unlockAudio();speakOrBeep('2');},
 copy(){const t=JSON.stringify(S);const fb=()=>{const bk=$('#bk');bk.value=t;bk.focus();bk.select();toast('Seleciona o texto na caixa e copia.');};
  try{navigator.clipboard.writeText(t).then(()=>toast('Dados copiados. Guarda-os numa nota.'),fb);}catch(e){fb();}},
 imp(b){const t=$('#bk').value.trim();if(!t){toast('Cola primeiro a cópia na caixa.');return;}let o;try{o=JSON.parse(t);}catch(e){toast('O texto colado não é uma cópia válida.');return;}
  if(b.dataset.arm!=='1'){b.dataset.arm='1';b.textContent='Toca outra vez: substitui os dados atuais';return;}
  S=migrate(o);persist();render();toast('Dados importados.');}
};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b,ev);});
document.addEventListener('change',ev=>{
 const t=ev.target,d=t.dataset;
 if(d.lp){const x=lpGet(d.lp),v=t.value.trim();if(x&&v){x.t=v;persist();}else if(x)t.value=x.t;return;}
 if(d.lpc){const x=lpGet(d.lpc);if(x){x.c=t.value;persist();}return;}
 if(d.rs){const x=S.lp.r.find(y=>y.id===d.rs),v=t.value.trim();if(x&&v){x.t=v;persist();}else if(x)t.value=x.t;return;}
 if(d.ex&&d.f!=null&&d.i!=null){
  const r=draft(d.k).x[d.ex],i=+d.i,f=+d.f,v=num(t.value),old=r.s[i][f];r.s[i][f]=v;
  if(f===0)for(let j=i+1;j<r.s.length;j++){if(!r.s[j][2]&&r.s[j][0]===old){r.s[j][0]=v;const el=document.querySelector(`input[data-ex="${d.ex}"][data-i="${j}"][data-f="0"]`);if(el)el.value=fmt(v);}}
  persist();return;
 }
 if(d.mx){draft(d.k).m[d.mx]=num(t.value);persist();return;}
 if(d.mid){
  const r=dayRec(d.ds),v=num(t.value);
  if(v===''){delete r.m[d.mid];}else{r.m[d.mid]=v;if(v>0){r.done[d.mid]=1;const it=t.closest('.item');if(it){it.classList.add('done');const c=it.querySelector('.chk');if(c){c.classList.add('on');c.setAttribute('aria-pressed','true');}}}}
  persist();return;
 }
 if(d.set){let v=t.value;if(d.set==='start'&&!v)return;if(d.set!=='start'&&d.set!=='snd')v=+v;S.set[d.set]=v;persist();if(d.set==='club'||d.set==='game'||d.set==='start')render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)stopAll();const id=e.target&&e.target.id;if(e.key==='Enter'&&(id==='lpNew'||id==='rsNew')){e.preventDefault();ACT[id==='lpNew'?'lpadd':'rsadd']();}});
if(STANDALONE){
 try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});}catch(e){}
}
/*__TEST__*/
render();setSync('wait');connect();
})();
</script>
</body>
</html>
